<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kolejka Pizz">
  <meta name="theme-color" content="#1B4D3E">
  <meta name="description" content="Kolejka zamówień pizz – Mobilna Italia">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <title>Mobilna Italia – Kolejka Pizz</title>
  <style>
    :root {
      --bg: #F5F0E6;
      --green: #1B4D3E;
      --green-dark: #0F3329;
      --cream: #FDF8F0;
      --red: #C8102E;
      --red-dark: #9E0C24;
      --text: #1A1A1A;
      --text-muted: #5A5A5A;
      --border: #E0D8C8;
      --shadow: rgba(27, 77, 62, 0.12);
      --radius: 12px;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    body {
      display: flex;
      flex-direction: column;
      padding-top: var(--safe-top);
      padding-bottom: var(--safe-bottom);
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      padding: 8px 10px 0;
    }

    /* Pizza buttons – dobre do klikania na małym ekranie */
    .pizzas {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      flex-shrink: 0;
      margin-bottom: 8px;
    }

    .pizza-btn {
      background: var(--cream);
      border: 2px solid var(--green);
      color: var(--green-dark);
      border-radius: var(--radius);
      padding: 12px 8px;
      font-size: 0.9rem;
      font-weight: 650;
      line-height: 1.2;
      text-align: center;
      cursor: pointer;
      transition: background 0.1s, transform 0.08s;
      box-shadow: 0 1px 4px var(--shadow);
      min-height: 52px;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .pizza-btn:active {
      background: var(--green);
      color: white;
      transform: scale(0.96);
    }

    /* Undo bar */
    .undo-bar {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    .undo-btn {
      flex: 1;
      background: var(--red);
      color: white;
      border: none;
      border-radius: var(--radius);
      padding: 13px 10px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(200, 16, 46, 0.22);
      transition: background 0.1s, transform 0.08s;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
      min-height: 48px;
    }

    .undo-btn:active {
      background: var(--red-dark);
      transform: scale(0.98);
    }

    .undo-btn:disabled {
      background: #B0A89A;
      box-shadow: none;
      opacity: 0.7;
      cursor: default;
    }

    .count-badge {
      background: var(--green);
      color: white;
      border-radius: var(--radius);
      padding: 13px 14px;
      font-size: 1.05rem;
      font-weight: 700;
      min-width: 56px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 1px 4px var(--shadow);
    }

    /* Queue */
    .queue-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: white;
      border-radius: var(--radius) var(--radius) 0 0;
      border: 1px solid var(--border);
      border-bottom: none;
      box-shadow: 0 -1px 8px var(--shadow);
    }

    .queue-header {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      background: var(--cream);
    }

    .queue-header h2 {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--green-dark);
    }

    .queue-header span {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-muted);
      background: white;
      padding: 3px 9px;
      border-radius: 16px;
      border: 1px solid var(--border);
    }

    .queue-list {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 6px;
    }

    .queue-item {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 6px 6px 6px 8px;
      margin-bottom: 6px;
    }

    .queue-item .num {
      flex-shrink: 0;
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: var(--green);
      color: white;
      font-size: 0.95rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .queue-item .name {
      flex: 1;
      font-size: 0.98rem;
      font-weight: 600;
      color: var(--text);
      line-height: 1.25;
      min-width: 0;
    }

    .check-btn {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background: var(--green);
      color: white;
      border: none;
      font-size: 1.35rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: 0 1px 4px var(--shadow);
      transition: background 0.1s, transform 0.08s;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .check-btn:active {
      background: var(--green-dark);
      transform: scale(0.94);
    }

    .empty-state {
      text-align: center;
      padding: 28px 16px;
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.45;
    }

    .empty-state strong {
      display: block;
      color: var(--green);
      font-size: 1.05rem;
      margin-bottom: 4px;
    }
  </style>
</head>
<body>
  <main>
    <div class="pizzas" id="pizzaButtons"></div>

    <div class="undo-bar">
      <button class="undo-btn" id="undoBtn" disabled>COFNIJ</button>
      <div class="count-badge" id="countBadge">0</div>
    </div>

    <section class="queue-section">
      <div class="queue-header">
        <h2>Do zrobienia</h2>
        <span id="queueCount">0</span>
      </div>
      <div class="queue-list" id="queueList">
        <div class="empty-state">
          <strong>Kolejka pusta</strong>
          Wybierz pizzę powyżej
        </div>
      </div>
    </section>
  </main>

  <script>
    const PIZZAS = [
      "Marinara",
      "Margherita",
      "Prosciutto e Funghi",
      "Carbonara",
      "Parma e Rucola",
      "Salame Milano",
      "Diavola Dolce",
      "Quattro Formaggi"
    ];

    const STORAGE_KEY = "mobilnaItalia_kolejka_v3";
    const UNDO_KEY = "mobilnaItalia_undo_v3";
    const NEXT_NUM_KEY = "mobilnaItalia_nextNum_v3";

    // State
    let queue = [];        // [{id, number, name}]
    let undoStack = [];    // [{type: 'add'|'complete', item}]
    let nextId = 1;
    let nextNumber = 1;    // numer dla klienta (nie resetuje się)

    // DOM
    const pizzaButtonsEl = document.getElementById("pizzaButtons");
    const queueListEl = document.getElementById("queueList");
    const queueCountEl = document.getElementById("queueCount");
    const countBadgeEl = document.getElementById("countBadge");
    const undoBtn = document.getElementById("undoBtn");

    function loadState() {
      try {
        const q = localStorage.getItem(STORAGE_KEY);
        const u = localStorage.getItem(UNDO_KEY);
        const n = localStorage.getItem(NEXT_NUM_KEY);

        if (q) {
          const parsed = JSON.parse(q);
          if (Array.isArray(parsed)) {
            queue = parsed;
            const maxId = queue.reduce((m, item) => Math.max(m, item.id || 0), 0);
            nextId = maxId + 1;
          }
        }
        if (u) {
          const parsedU = JSON.parse(u);
          if (Array.isArray(parsedU)) undoStack = parsedU;
        }
        if (n) {
          const num = parseInt(n, 10);
          if (!isNaN(num) && num > 0) nextNumber = num;
        }
        // jeśli w kolejce są numery wyższe – dogoń
        const maxNum = queue.reduce((m, item) => Math.max(m, item.number || 0), 0);
        if (maxNum >= nextNumber) nextNumber = maxNum + 1;
      } catch (e) {
        queue = [];
        undoStack = [];
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(queue));
        localStorage.setItem(UNDO_KEY, JSON.stringify(undoStack));
        localStorage.setItem(NEXT_NUM_KEY, String(nextNumber));
      } catch (e) {}
    }

    function pushUndo(entry) {
      undoStack.push(entry);
      if (undoStack.length > 60) undoStack.shift();
    }

    function addPizza(name) {
      const item = {
        id: nextId++,
        number: nextNumber++,
        name
      };
      queue.push(item);
      pushUndo({ type: "add", item });
      saveState();
      render();
    }

    function completePizza(id) {
      const idx = queue.findIndex(item => item.id === id);
      if (idx === -1) return;
      const [item] = queue.splice(idx, 1);
      pushUndo({ type: "complete", item });
      saveState();
      render();
    }

    function undo() {
      if (undoStack.length === 0) return;
      const entry = undoStack.pop();

      if (entry.type === "add") {
        const idx = queue.findIndex(i => i.id === entry.item.id);
        if (idx !== -1) queue.splice(idx, 1);
      } else if (entry.type === "complete") {
        queue.push(entry.item);
      }

      saveState();
      render();
    }

    function render() {
      if (queue.length === 0) {
        queueListEl.innerHTML = `
          <div class="empty-state">
            <strong>Kolejka pusta</strong>
            Wybierz pizzę powyżej
          </div>`;
      } else {
        queueListEl.innerHTML = queue.map(item => `
          <div class="queue-item" data-id="${item.id}">
            <div class="num">${item.number}</div>
            <div class="name">${escapeHtml(item.name)}</div>
            <button class="check-btn" aria-label="Gotowe" data-id="${item.id}">✓</button>
          </div>
        `).join("");
      }

      queueCountEl.textContent = queue.length;
      countBadgeEl.textContent = queue.length;
      undoBtn.disabled = undoStack.length === 0;
    }

    function escapeHtml(str) {
      const div = document.createElement("div");
      div.textContent = str;
      return div.innerHTML;
    }

    function initButtons() {
      pizzaButtonsEl.innerHTML = PIZZAS.map(name => `
        <button class="pizza-btn" data-name="${escapeHtml(name)}">${escapeHtml(name)}</button>
      `).join("");

      pizzaButtonsEl.addEventListener("click", (e) => {
        const btn = e.target.closest(".pizza-btn");
        if (!btn) return;
        const name = btn.dataset.name;
        if (name) addPizza(name);
      });

      queueListEl.addEventListener("click", (e) => {
        const btn = e.target.closest(".check-btn");
        if (!btn) return;
        const id = parseInt(btn.dataset.id, 10);
        if (!isNaN(id)) completePizza(id);
      });

      undoBtn.addEventListener("click", undo);
    }

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./service-worker.js").catch(() => {});
      });
    }

    loadState();
    initButtons();
    render();
  </script>
</body>
</html>
